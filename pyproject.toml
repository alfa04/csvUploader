[project]
name = "csv-uploader"
version = "0.1.0"
description = "Cloud-based CSV drug discovery data ingestion & analytics service (AWS Lambda + API Gateway)"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34",
    "aws-lambda-powertools>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,dynamodb]>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
